name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Assemble AppDir
        run: |
          set -eux
          APPDIR=build/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/scalable/apps" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp linux/dev.codegod.pixibrowse.desktop "$APPDIR/usr/share/applications/"
          cp linux/dev.codegod.pixibrowse.desktop "$APPDIR/"
          cp linux/dev.codegod.pixibrowse.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/"
          cp linux/runner/resources/pixibrowse.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/dev.codegod.pixibrowse.png"
          cp linux/runner/resources/pixibrowse.png "$APPDIR/dev.codegod.pixibrowse.png"
          ln -s dev.codegod.pixibrowse.png "$APPDIR/.DirIcon"
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/pixibrowse" "$@"
          SH
          chmod +x "$APPDIR/AppRun"
      - name: Build AppImage
        run: |
          set -eux
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool build/AppDir pixibrowse-x86_64.AppImage
          ls -lh pixibrowse-x86_64.AppImage
      - name: Smoke test
        run: |
          set -eux
          sudo apt-get install -y xvfb
          ./pixibrowse-x86_64.AppImage --appimage-extract >/dev/null
          ldd squashfs-root/usr/bin/pixibrowse | tee ldd.txt
          ! grep -q "not found" ldd.txt
          timeout 10 xvfb-run -a squashfs-root/AppRun || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: pixibrowse-x86_64.AppImage
          path: pixibrowse-x86_64.AppImage
      - name: Publish rolling "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest pixibrowse-x86_64.AppImage \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Rolling build of main at $GITHUB_SHA. Download, \`chmod +x pixibrowse-x86_64.AppImage\`, and run."
