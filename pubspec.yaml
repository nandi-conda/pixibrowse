name: pixibrowse
description: "A desktop and web browser for conda channels, built on flatkit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flatkit:
    git:
      url: https://github.com/codegod100/flutterkit
      ref: main
  http: ^1.6.0
  archive: ^4.3.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
